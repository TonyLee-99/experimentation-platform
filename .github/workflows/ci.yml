# CI: lint and tests on every push.
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python -e ".[dev]" gsdesign==0.1.5
      - name: lint
        run: .venv/bin/ruff check src tests && .venv/bin/ruff format --check src tests && .venv/bin/mypy src
      - name: unit, property and cross-check tests (real-data tests skip without data)
        run: .venv/bin/pytest -m "not data" --cov=expkit.stats --cov-fail-under=90
  reproduce:
    # Full pipeline incl. 0.3 GB download; manual trigger only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: make all
