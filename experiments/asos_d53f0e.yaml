# A hard call on a real ASOS experiment (published as daily per-arm n / mean / variance snapshots).
name: asos_d53f0e_variant1
description: >
  Real ASOS.com online experiment d53f0e, treatment 1 vs control, 47 days. ASOS publishes four unnamed
  business decision metrics; metric_1 is treated as primary, metric_2 as secondary, metrics 3 and 4 as guardrails.
source_type: summary
summary:
  experiment_id: d53f0e
  variant_id: 1
  metrics: {metric_1: 1, metric_2: 2, metric_3: 3, metric_4: 4}
expected_split: {"0": 0.5, "1": 0.5}
primary_metric: metric_1
secondary_metrics: [metric_2]
guardrails:
  - {metric: metric_3, max_relative_drop: 0.005}
  - {metric: metric_4, max_relative_drop: 0.005}
sequential:
  arrival_order: real
  tau_relative: 0.0061              # mSPRT mixing sd = ASOS portfolio prior sd for metric 1 (results/asos_portfolio.json)
decision:
  alpha: 0.05
  loss_threshold_relative: 0.001
  prior_sd_relative: 0.0061         # same portfolio prior
pm_note: >
  Don't ship on the dashboard's day-7 "win". metric_1 was {primary_day7:+.2f}% on day 7, {primary_day14:+.2f}% on day 14
  and {primary_final:+.2f}% on day {days:.0f}, and the guardrails fell from {g1_day7:+.1f}% / {g2_day7:+.1f}% on day 7 to
  {g1_final:+.2f}% / {g2_final:+.2f}%: a decaying, novelty-shaped effect whose 95% CI on metric_1 still includes zero.
  Extending will not settle the guardrails: over the last 14 days traffic grew {n_growth_pct:.0f}% but the guardrail SEs
  shrank only {g1_se_shrink_pct:.0f}% (these metrics accumulate per user), so two more weeks leaves the lower bounds near
  {g1_lower_after:+.2f}% / {g2_lower_after:+.2f}%, still outside the -{margin_pct:.1f}% margin; clearing it would take
  about {g1_var_factor:.0f}-{g2_var_factor:.0f}x less variance, roughly {g1_days_needed:.0f}+ more days. So this is a risk
  call, not a wait: if the change is cheap to roll back, ship to a 10% holdback and watch the guardrails; otherwise agree
  a wider guardrail margin up front, or drop the change.
output: reports/asos_d53f0e_readout.html
results_json: scorecard_asos_d53f0e
