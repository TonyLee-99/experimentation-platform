[project]
name = "expkit"
version = "0.1.0"
description = "Experimentation analysis platform: SQL metric layer, stats engine, validation suite, automated scorecard."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "numpy==2.5.4",
  "scipy==1.18.1",
  "pandas==3.1.0",
  "pyarrow==26.0.0",
  "duckdb==2.0.0",
  "statsmodels==0.15.0",
  "scikit-learn==1.9.1",
  "lightgbm==4.7.0",
  "pyyaml==6.0.3",
  "jinja2==3.1.6",
  "matplotlib==3.11.2",
  "typer==0.27.3",
  "pydantic==2.14.1",
  "huggingface-hub==2.3.0",
  "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "pytest-cov",
  "hypothesis==6.170.13",
  "ruff==0.17.3",
  "mypy==2.4.1",
  "types-PyYAML",
  "linearmodels==7.1",
  "causalml==0.18.0",
  "econml==0.17.0",
]

[project.scripts]
expkit = "expkit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expkit"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "NPY", "RUF"]
ignore = ["N803", "N806", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = []
files = ["src/expkit"]
disallow_any_generics = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["data: needs the real downloaded datasets (skipped if missing)"]

[tool.ruff.lint.per-file-ignores]
"src/expkit/validation/acceptance.py" = ["E501"]  # long human-readable evidence strings
